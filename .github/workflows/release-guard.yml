# Two guards for "every change to shipped files ships with a version bump" (RELEASING.md).
#
#   pull_request → main:  scripts/check-version-bump.sh fails the PR when skills/, hooks/ or
#                         plugin.json changed without a higher version, a CHANGELOG heading and
#                         a README line; the script tests, the load budgets and the config
#                         schema checks (the schema and key table are current, no entry still
#                         says "unreleased" in a version bump, every cited key is registered,
#                         this repository's own config is valid) run too. A draft
#                         runs nothing: marking it ready for review starts the check, once, on
#                         the reviewed head (the delivery loop opens every pull request as a
#                         draft and flips it when review has settled). The job is named
#                         `release-guard`, the required check on `main`.
#   push → main:          creates and pushes the annotated tag devstride--v<version> when it
#                         does not exist yet, so a merged bump is a release the update check can
#                         see. This is the only place a release is tagged: never tag by hand.
name: release-guard
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  # one group per pull request; every push to main gets its own, so no merge's tag job is dropped
  group: release-guard-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    name: release-guard
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Version bump accompanies shipped changes
        run: bash scripts/check-version-bump.sh --base "origin/${{ github.base_ref }}" --head HEAD
      - name: Shell syntax
        run: for f in hooks/*.sh scripts/*.sh scripts/tests/*.sh skills/*/scripts/*.sh; do [ -f "$f" ] && bash -n "$f"; done
      - name: Script tests
        run: bash scripts/tests/run.sh
      - name: The shipped text names no single repository's tooling
        run: bash scripts/check-neutrality.sh
      - name: Load budgets and reference load fields
        run: bash scripts/measure-cost.sh --check
      - name: Config schema and key table match the seam registry
        run: python3 scripts/build-config-schema.py --check --release --base "origin/${{ github.base_ref }}"
      - name: Every config key the shipped text cites is registered
        run: python3 scripts/check-config-keys.py
      - name: This repository's own config is valid
        run: python3 skills/doctor/scripts/validate-config.py .claude/ds-config.json --schema schemas/ds-config.schema.json
  tag:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Tag the merged version when it is not tagged yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          V="$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')"
          T="devstride--v$V"
          if git rev-parse -q --verify "refs/tags/$T" >/dev/null; then
            echo "$T already exists at $(git rev-parse --short "$T^{commit}"); nothing to do"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$T" -m "devstride v$V"
          git push origin "refs/tags/$T"
          echo "tagged $T at $(git rev-parse --short HEAD)"
